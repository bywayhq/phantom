version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      fuzz-cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  # Dependabot's pip support reads `*.txt` requirement files and keeps their
  # `--hash` pins current.
  - package-ecosystem: pip
    directory: /scripts/conformance/quic-interop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directories:
      - /scripts/conformance/quic-interop
      - /scripts/conformance/tls-anvil
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
