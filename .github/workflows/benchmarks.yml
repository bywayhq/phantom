name: Benchmark report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Linux transport benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Record environment
        run: |
          rustc -Vv
          uname -a
          lscpu

      - name: Run report-only benchmarks
        run: |
          mkdir -p target/benchmark-report
          set -o pipefail
          cargo bench --locked -p phantom-net --bench transport -- --noplot 2>&1 | tee target/benchmark-report/output.txt
          cargo bench --locked --manifest-path vendor/tungstenite/Cargo.toml \
            --bench deflate --features deflate -- --noplot 2>&1 | tee -a target/benchmark-report/output.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-benchmarks-${{ github.sha }}
          path: |
            target/benchmark-report/output.txt
            target/criterion
          if-no-files-found: warn
          retention-days: 14
