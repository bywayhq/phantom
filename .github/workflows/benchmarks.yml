name: Benchmark report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Linux transport benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Record environment
        run: |
          rustc -Vv
          uname -a
          lscpu

      - name: Run report-only benchmarks
        run: |
          mkdir -p target/benchmark-report
          set -o pipefail
          cargo bench --locked -p phantom-net --bench transport -- --noplot 2>&1 | tee target/benchmark-report/output.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transport-benchmarks-${{ github.sha }}
          path: |
            target/benchmark-report/output.txt
            target/criterion
          if-no-files-found: warn
          retention-days: 14
