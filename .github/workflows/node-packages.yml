name: Node package candidates

on:
  pull_request:
    paths:
      - bindings/node/**
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .gitattributes
      - LICENSE-*
      - scripts/release/node_artifact.py
      - scripts/release/node_registry.py
      - scripts/release/promote_prebuilds.py
      - scripts/release/tests/test_node_registry.py
      - scripts/release/cli_artifact.py
      - scripts/release/notices/**
      - scripts/dev/tests/test_node_artifact.py
      - scripts/dev/with-cargo-lock.sh
      - scripts/dev/binding_h3_peer.py
      - scripts/conformance/binding_upload_h3.py
      - scripts/conformance/binding_headers_h3.py
      - scripts/conformance/aioquic_versions.py
      - scripts/conformance/loopback_tls.py
      - .github/workflows/node-packages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-package-candidates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  candidate:
    name: Node package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: x64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install HTTP/3 peer Python
        id: h3-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Prepare isolated HTTP/3 peer
        shell: bash
        env:
          H3_PYTHON: ${{ steps.h3-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$H3_PYTHON" -m venv "$RUNNER_TEMP/phantom-h3-peer"
          if [[ "$RUNNER_OS" == Windows ]]; then
            peer="$RUNNER_TEMP/phantom-h3-peer/Scripts/python.exe"
          else
            peer="$RUNNER_TEMP/phantom-h3-peer/bin/python"
          fi
          "$peer" -m pip install --disable-pip-version-check aioquic==1.3.0
          printf 'PHANTOM_H3_PEER_PYTHON=%s\n' "$peer" >> "$GITHUB_ENV"

      - name: Install Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          architecture: ${{ matrix.architecture }}

      - name: Retain Node.js 22 executable
        shell: bash
        run: node -p '"NODE22=" + process.execPath' >> "$GITHUB_ENV"

      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          architecture: ${{ matrix.architecture }}

      - name: Retain Node.js 24 executable
        shell: bash
        run: node -p '"NODE24=" + process.execPath' >> "$GITHUB_ENV"

      - name: Install project toolchain
        run: rustc --version

      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --version=2.16.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM installation failed" }
          $nasmDirectory = (Get-Item -LiteralPath 'HKCU:\Software\nasm').GetValue('')
          if (-not (Test-Path -LiteralPath (Join-Path $nasmDirectory 'nasm.exe'))) { throw "NASM executable is missing" }
          $env:PATH = "$nasmDirectory;$env:PATH"
          $nasmDirectory >> $env:GITHUB_PATH
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw "NASM is unavailable" }

      - name: Check package helper
        run: python -m unittest discover -s scripts/dev/tests -p test_node_artifact.py

      - name: Build and verify optimized native package
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          scripts/dev/with-cargo-lock.sh python scripts/release/node_artifact.py \
            --target "$PACKAGE_TARGET" --node22 "$NODE22" --node24 "$NODE24" \
            --output target/node-package-candidate

      - name: Upload verified package and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-node-${{ matrix.target }}
          path: target/node-package-candidate/verified/
          if-no-files-found: error

      - name: Retain build and installation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-node-logs-${{ matrix.target }}
          path: target/node-package-candidate/logs/
          if-no-files-found: ignore

  registry-assembly:
    name: Assemble npm registry packages
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Node.js for packing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"

      - name: Download Linux candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-node-x86_64-unknown-linux-gnu
          path: target/npm-candidates/linux

      - name: Download Windows candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-node-x86_64-pc-windows-msvc
          path: target/npm-candidates/windows

      - name: Download macOS candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-node-aarch64-apple-darwin
          path: target/npm-candidates/macos

      - name: Check registry assembly helper
        run: python -m unittest discover -s scripts/release/tests -p test_node_registry.py

      - name: Assemble unchanged native payloads into npm packages
        shell: bash
        run: |
          node_exe="$(node -p 'process.execPath')"
          npm_cli="$(dirname "$node_exe")/../lib/node_modules/npm/bin/npm-cli.js"
          python scripts/release/node_registry.py assemble \
            --candidate target/npm-candidates/linux \
            --candidate target/npm-candidates/windows \
            --candidate target/npm-candidates/macos \
            --source-revision "$(git rev-parse HEAD)" \
            --node "$node_exe" --npm-cli "$npm_cli" \
            --output target/npm-registry-assembly

      - name: Upload assembled packages and identities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-npm-registry-assembly
          path: target/npm-registry-assembly/assembled/
          if-no-files-found: error

      - name: Retain assembly logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-npm-registry-assembly-logs
          path: target/npm-registry-assembly/logs/
          if-no-files-found: ignore

  registry-installation:
    name: Npm resolver install (${{ matrix.target }})
    needs: registry-assembly
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: x64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install HTTP/3 peer Python
        id: h3-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Prepare isolated HTTP/3 peer
        shell: bash
        env:
          H3_PYTHON: ${{ steps.h3-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$H3_PYTHON" -m venv "$RUNNER_TEMP/phantom-h3-peer"
          if [[ "$RUNNER_OS" == Windows ]]; then
            peer="$RUNNER_TEMP/phantom-h3-peer/Scripts/python.exe"
          else
            peer="$RUNNER_TEMP/phantom-h3-peer/bin/python"
          fi
          "$peer" -m pip install --disable-pip-version-check aioquic==1.3.0
          printf 'PHANTOM_H3_PEER_PYTHON=%s\n' "$peer" >> "$GITHUB_ENV"

      - name: Install Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          architecture: ${{ matrix.architecture }}

      - name: Retain Node.js 22 executable
        shell: bash
        run: node -p '"NODE22=" + process.execPath' >> "$GITHUB_ENV"

      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          architecture: ${{ matrix.architecture }}

      - name: Retain Node.js 24 executable
        shell: bash
        run: node -p '"NODE24=" + process.execPath' >> "$GITHUB_ENV"

      - name: Download assembled packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-npm-registry-assembly
          path: target/npm-registry-assembly

      - name: Check normal and lockfile installs with installed APIs
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python scripts/release/node_registry.py check-install \
            --assembly target/npm-registry-assembly --target "$PACKAGE_TARGET" \
            --node22 "$NODE22" --node24 "$NODE24" \
            --output target/npm-registry-installation

      - name: Retain installation receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-npm-registry-installation-${{ matrix.target }}
          path: target/npm-registry-installation/
          if-no-files-found: error
