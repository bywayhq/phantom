name: Windows native DNS capture

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Native DNS scene
        type: choice
        required: true
        default: initial
        options:
          - initial
          - drop-first-udp-a
          - two-server
          - address-order
          - ttl
          - native-https-ech
          - network-change-preflight

permissions:
  contents: read

concurrency:
  group: windows-native-dns-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  network-change-preflight:
    if: inputs.scenario == 'network-change-preflight'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Inspect available network test devices and tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'network-change-preflight'
          New-Item -ItemType Directory -Path $output | Out-Null
          $driver = Join-Path $env:windir 'INF/netloop.inf'
          $kitTools = 'C:/Program Files (x86)/Windows Kits/10/Tools'
          $devcon = @(Get-Command devcon.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
          if (Test-Path -LiteralPath $kitTools) {
            $devcon += @(Get-ChildItem -LiteralPath $kitTools -Filter devcon.exe -File -Recurse |
              Select-Object -ExpandProperty FullName)
          }
          [ordered]@{
            source = '${{ github.sha }}'
            os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            elevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator)
            adapters = @(Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetAdapter |
              Select-Object Name, InterfaceDescription, InterfaceIndex, InterfaceGuid, InterfaceType, InterfaceOperationalStatus)
            interfaces = @(Get-NetIPInterface | Select-Object InterfaceIndex, AddressFamily, Dhcp, ConnectionState)
            netloop_inf = if (Test-Path -LiteralPath $driver) { Get-FileHash -LiteralPath $driver -Algorithm SHA256 }
              else { $null }
            devcon_path_or_kit_tools = @($devcon | Sort-Object -Unique)
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$output/inventory.json" -Encoding utf8
          & pnputil.exe /? | Set-Content -LiteralPath "$output/pnputil-help.txt" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'cannot inspect PnPUtil commands' }

      - name: Retain read-only preflight
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-change-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-change-preflight/
          if-no-files-found: error
          retention-days: 14

  capture:
    if: inputs.scenario != 'network-change-preflight'
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.scenario == 'native-https-ech' && 45 || 15 }}
    steps:
      - name: Check out capture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Install pinned capture dependencies before DNS changes
        run: >-
          python -m pip install --require-hashes
          -r scripts/requirements.txt
          -r scripts/capture/hooks-requirements.txt

      - name: Build the TLS capture peer before DNS changes
        if: inputs.scenario == 'native-https-ech'
        shell: bash
        run: |
          set -euo pipefail
          for tool in git cmake clang nasm; do command -v "$tool"; done
          rustup show active-toolchain
          bash scripts/dev/with-cargo-lock.sh cargo build -p phantom-net \
            --example capture_ech_client_hello --all-features --locked --jobs 2

      - name: Capture the selected native DNS scene
        env:
          PHANTOM_CAPTURE_SCENARIO: ${{ inputs.scenario }}
        run: >-
          python -m scripts.capture.windows_native_dns_capture
          --scenario "$env:PHANTOM_CAPTURE_SCENARIO"

      - name: Restore and verify exact-name DNS policy before upload
        id: restore
        if: always()
        shell: pwsh
        run: |
          $output = 'target/windows-native-dns-capture'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & scripts/capture/windows_native_dns_guard.ps1 -Action Verify -StatePath "$output/nrpt-state.json" |
            Set-Content -LiteralPath "$output/workflow-restoration.json" -Encoding utf8

      - name: Retain attempt and failures after restoration
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox157-native-dns-${{ inputs.scenario }}-windows-2025-${{ github.sha }}-${{ github.run_attempt }}
          path: target/windows-native-dns-capture/
          if-no-files-found: error
          retention-days: 14
