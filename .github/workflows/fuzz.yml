name: Parser fuzzing

on:
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - Cargo.lock
      - Cargo.toml
      - crates/phantom-net/**
      - crates/phantom-profile/**
      - crates/phantom-quic-btls/**
      - crates/phantom-testkit/**
      - crates/phantom/**
      - fuzz/**
      - vendor/**
  push:
    branches: [main]
    paths:
      - .github/workflows/fuzz.yml
      - Cargo.lock
      - Cargo.toml
      - crates/phantom-net/**
      - crates/phantom-profile/**
      - crates/phantom-quic-btls/**
      - crates/phantom-testkit/**
      - crates/phantom/**
      - fuzz/**
      - vendor/**
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * 0"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '300' || '15' }}
  NIGHTLY_TOOLCHAIN: nightly-2026-09-01

jobs:
  lint:
    name: Lint fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Check formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check

      # `--all-targets`, not `--bins`: the harnesses and their deterministic
      # regressions live in the crate's library, and the binaries are wrappers.
      - name: Lint
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

      # The seed regressions run here, on the project toolchain, because they
      # need neither a nightly nor a sanitizer. A seed that stops parsing fails
      # this job instead of silently weakening every fuzz iteration.
      - name: Test harnesses and structural seeds
        run: cargo test --manifest-path fuzz/Cargo.toml --locked

  fuzz:
    name: ${{ matrix.target }} under ASan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: alt_svc_snapshot
            max_len: 16384
          - target: client_hello
            max_len: 65536
          - target: cookie_jar
            max_len: 16384
          - target: cookie_snapshot
            max_len: 16384
          # 16 KiB, not the 64 KiB the other peer-facing targets use: the
          # response-head observer and the protocol engine each reparse their
          # buffered head on every read, bounded by MAX_RESPONSE_HEAD_BYTES
          # (32 KiB), so a longer head read one byte at a time costs quadratic
          # time and reports a timeout rather than a defect. The two head
          # limits that this puts out of reach are covered by the regressions
          # in fuzz/src/http1_response/tests.rs.
          - target: http1_response
            max_len: 16384
          - target: http_connect_response
            max_len: 65536
          - target: http2_frame
            max_len: 262144
          # A DNS message over TCP is at most 65,535 bytes.
          - target: https_record
            max_len: 65536
          - target: proxy_basic_challenge
            max_len: 16384
          - target: quic_transport_parameters
            max_len: 65536
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        run: rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal

      - name: Install cargo-fuzz
        run: >-
          cargo "+$NIGHTLY_TOOLCHAIN" install cargo-fuzz
          --version "$CARGO_FUZZ_VERSION" --locked

      - name: Build fuzz target
        working-directory: fuzz
        run: |
          cargo "+$NIGHTLY_TOOLCHAIN" fetch --locked
          cargo "+$NIGHTLY_TOOLCHAIN" fuzz build --sanitizer address "${{ matrix.target }}"

      # Scheduled runs grow one corpus per target; every run starts from the
      # newest saved corpus. Cache keys are immutable, so each save is unique.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzz target
        working-directory: fuzz
        run: >-
          cargo "+$NIGHTLY_TOOLCHAIN" fuzz run
          --sanitizer address "${{ matrix.target }}" --
          -max_total_time="$FUZZ_SECONDS"
          -max_len="${{ matrix.max_len }}"
          -timeout=10

      - name: Save fuzz corpus
        if: github.event_name == 'schedule' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: warn
          retention-days: 14
