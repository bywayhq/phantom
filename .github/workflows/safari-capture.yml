name: Safari loopback capture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        protocol: [h1, h2]
    steps:
      - name: Check out capture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install pinned capture dependencies
        run: python -m pip install --require-hashes -r scripts/requirements.txt

      - name: Test the Safari driver adapter
        run: python -m unittest scripts.capture.tests.test_safari_webdriver

      - name: Attempt one Safari SSE reconnect capture
        shell: bash
        env:
          CAPTURE_PROTOCOL: ${{ matrix.protocol }}
        run: |
          mkdir -p target
          set +e
          python -m scripts.capture.safari_webdriver --protocol "$CAPTURE_PROTOCOL" \
            --output-dir target/safari-capture > target/safari-attempt.log 2>&1
          status=$?
          printf '%s\n' "$status" > target/safari-attempt.exit
          cat target/safari-attempt.log
          exit "$status"

      - name: Retain capture and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-${{ matrix.protocol }}-sse-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/safari-capture/result.json
            target/safari-capture/reconnect-204.txt
            target/safari-capture/peer-certificate.der
            target/safari-attempt.log
            target/safari-attempt.exit
          if-no-files-found: warn
          retention-days: 14
