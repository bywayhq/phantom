name: macOS headed Chrome capture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-headful-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Chrome HTTP SSE (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            python_arch: arm64
            expected_arch: arm64
          - runner: macos-15-intel
            python_arch: x64
            expected_arch: x86_64
    steps:
      - name: Check out capture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          architecture: ${{ matrix.python_arch }}

      - name: Attempt one headed Chrome HTTP SSE capture
        shell: bash
        env:
          CAPTURE_RUNNER_LABEL: ${{ matrix.runner }}
          CAPTURE_EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          python -m scripts.capture.macos_headful_capture

      - name: Retain attempt and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-http-sse-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/macos-headful-capture/provenance.json
            target/macos-headful-capture/capture.stdout.log
            target/macos-headful-capture/capture.stderr.log
            target/macos-headful-capture/fixtures/reconnect-204.txt
          if-no-files-found: warn
          retention-days: 14
