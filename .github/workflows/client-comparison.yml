name: Client comparison adapters

on:
  pull_request:
    paths:
      - tools/client-bench/**
      - .github/workflows/client-comparison.yml
  push:
    branches: [main]
    paths:
      - tools/client-bench/**
      - .github/workflows/client-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  httpcloak:
    name: httpcloak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
        working-directory: tools/client-bench/httpcloak
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: tools/client-bench/httpcloak/go.sum
      - name: Check module integrity and formatting
        run: |
          go version
          go mod verify
          gofmt -w *.go
          git diff --exit-code -- '*.go'
      - name: Test public session controls
        run: go test -mod=readonly -count=1 -timeout=90s -v .
      - name: Check adapter
        run: go vet -mod=readonly .
      - name: Build adapter
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/httpcloak-bench" .
