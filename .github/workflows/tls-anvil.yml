name: TLS-Anvil client conformance

on:
  # Pull requests run this suite only when a maintainer applies the
  # `conformance` label; see the job condition.
  pull_request:
    types: [labeled, reopened, synchronize]
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/tls-anvil.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/phantom-net/**
      - crates/phantom-profile/**
      - crates/phantom-quic-btls/**
      - crates/phantom-testkit/**
      - scripts/conformance/tls-anvil/**
      - scripts/conformance/tls_anvil.py
      - scripts/conformance/tests/test_tls_anvil.py
      - vendor/btls/**
      - vendor/h3/**
      - vendor/http2/**
      - vendor/quinn-proto/**
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A run for an unrelated label gets its own group so it cannot cancel a
  # labeled run in progress.
  group: tls-anvil-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'conformance' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  conformance:
    name: TLS 1.2 and TLS 1.3 client smoke
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'conformance')
      && (github.event.action != 'labeled' || github.event.label.name == 'conformance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Check runner prerequisites
        run: docker version

      - name: Run pinned TLS-Anvil client suite
        run: python3 scripts/conformance/tls_anvil.py

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls-anvil-smoke-${{ github.sha }}
          path: |
            target/tls-anvil/**/adapter.log
            target/tls-anvil/**/container.log
            target/tls-anvil/**/metadata.json
            target/tls-anvil/**/summary.json
            target/tls-anvil/**/suite/report.json
            target/tls-anvil/**/suite/result_map.json
            target/tls-anvil/**/suite/results/**/_testRun.json
          if-no-files-found: warn
          retention-days: 30
