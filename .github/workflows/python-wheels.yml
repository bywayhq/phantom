name: Python wheel candidates

on:
  pull_request:
    paths:
      - bindings/python/**
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .gitattributes
      - LICENSE-*
      - scripts/dev/check_python_binding.py
      - scripts/dev/binding_h3_peer.py
      - scripts/conformance/binding_upload_h3.py
      - scripts/conformance/binding_headers_h3.py
      - scripts/conformance/aioquic_versions.py
      - scripts/conformance/loopback_tls.py
      - scripts/dev/tests/test_python_binding*.py
      - scripts/release/python_sdist.py
      - scripts/release/tests/test_python_sdist.py
      - scripts/dev/with-cargo-lock.sh
      - scripts/release/cli_artifact.py
      - scripts/release/notices/**
      - .github/workflows/python-wheels.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-wheel-candidates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  source:
    name: Python source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate one locked and noticed source archive
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/release/tests -p test_python_sdist.py
          python -m pip install --no-cache-dir 'maturin==1.15.0'
          scripts/dev/with-cargo-lock.sh cargo fetch --locked
          scripts/dev/with-cargo-lock.sh python -m maturin sdist \
            --manifest-path bindings/python/Cargo.toml --out target/python-source-original
          archives=(target/python-source-original/*.tar.gz)
          test "${#archives[@]}" = 1
          scripts/dev/with-cargo-lock.sh python scripts/release/python_sdist.py \
            --source-archive "${archives[0]}" --source-revision "$(git rev-parse HEAD)" \
            --output target/python-source-candidate
          git diff --exit-code HEAD
      - name: Retain resolution-verified source for the three wheel consumers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-python-source
          path: target/python-source-candidate/verified/
          if-no-files-found: error
      - name: Retain source logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-python-source-logs
          path: target/python-source-candidate/logs/
          if-no-files-found: ignore

  candidate:
    name: Python wheel (${{ matrix.target }})
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            python-architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            python-architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the same source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-python-source
          path: target/python-source

      - name: Install HTTP/3 peer Python
        if: runner.os != 'Linux'
        id: h3-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install current stable CPython for a second installation of the same wheel
        if: runner.os != 'Linux'
        id: stable
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          architecture: ${{ matrix.python-architecture }}

      - name: Install CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          architecture: ${{ matrix.python-architecture }}

      - name: Prepare isolated HTTP/3 peer
        if: runner.os != 'Linux'
        shell: bash
        env:
          H3_PYTHON: ${{ steps.h3-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$H3_PYTHON" -m venv "$RUNNER_TEMP/phantom-h3-peer"
          if [[ "$RUNNER_OS" == Windows ]]; then
            peer="$RUNNER_TEMP/phantom-h3-peer/Scripts/python.exe"
          else
            peer="$RUNNER_TEMP/phantom-h3-peer/bin/python"
          fi
          "$peer" -m pip install --disable-pip-version-check aioquic==1.3.0
          printf 'PHANTOM_H3_PEER_PYTHON=%s\n' "$peer" >> "$GITHUB_ENV"

      - name: Install project toolchain
        run: rustc --version

      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --version=2.16.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM installation failed" }
          $nasmDirectory = (Get-Item -LiteralPath 'HKCU:\Software\nasm').GetValue('')
          if (-not (Test-Path -LiteralPath (Join-Path $nasmDirectory 'nasm.exe'))) { throw "NASM executable is missing" }
          $env:PATH = "$nasmDirectory;$env:PATH"
          $nasmDirectory >> $env:GITHUB_PATH
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw "NASM is unavailable" }

      - name: Check wheel helper
        run: python -m unittest discover -s scripts/dev/tests -p 'test_python_binding*.py'

      - name: Build and verify optimized native wheel from source
        if: runner.os != 'Linux'
        shell: bash
        env:
          WHEEL_TARGET: ${{ matrix.target }}
          STABLE_PYTHON: ${{ steps.stable.outputs.python-path }}
        run: |
          set -euo pipefail
          archives=(target/python-source/*.tar.gz)
          test "${#archives[@]}" = 1
          scripts/dev/with-cargo-lock.sh python scripts/dev/check_python_binding.py \
            --release-candidate --target "$WHEEL_TARGET" --output target/python-wheel-candidate \
            --source-archive "${archives[0]}" --source-receipt target/python-source/receipt.json \
            --additional-python "$STABLE_PYTHON"

      - name: Restore manylinux package cache
        if: runner.os == 'Linux'
        id: dnf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/phantom-dnf-cache
          key: manylinux-dnf-${{ hashFiles('.github/workflows/python-wheels.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: manylinux-dnf-${{ hashFiles('.github/workflows/python-wheels.yml') }}-

      - name: Build and install the same source in manylinux 2.28
        if: runner.os == 'Linux'
        timeout-minutes: 40
        shell: bash
        env:
          MANYLINUX_CONTAINER: phantom-manylinux-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image=quay.io/pypa/manylinux_2_28_x86_64@sha256:1e7b8460ad8fb3fb0fbe1cd818845159ac896b4fd17452d56e892c291f3b97a8
          mkdir -p target/python-wheel-candidate/dnf-logs "$RUNNER_TEMP/phantom-dnf-cache"
          docker run --name "$MANYLINUX_CONTAINER" -i --entrypoint bash \
            -v "$PWD:/io:ro" -v "$PWD/.git:/io/.git" \
            -v "$PWD/target/python-wheel-candidate:/output" \
            -v "$RUNNER_TEMP/phantom-dnf-cache:/var/cache/dnf" \
            -w /io -e CARGO_BUILD_JOBS=2 -e PHANTOM_MANYLINUX_IMAGE="$image" "$image" -s <<'BUILD'
          set -euo pipefail
          export PATH=/opt/python/cp310-cp310/bin:/root/.cargo/bin:$PATH
          /opt/python/cp312-cp312/bin/python -m venv /tmp/phantom-h3-peer
          /tmp/phantom-h3-peer/bin/python -m pip install --disable-pip-version-check aioquic==1.3.0
          export PHANTOM_H3_PEER_PYTHON=/tmp/phantom-h3-peer/bin/python
          dnf --verbose --setopt=keepcache=True --setopt=logdir=/output/dnf-logs \
            --setopt=logfilelevel=10 --disablerepo='*' --enablerepo=baseos,appstream,extras,powertools \
            install --assumeyes nasm-2.15.03-3.el8.x86_64 \
            clang-libs-21.1.8-1.module_el8.10.0+4172+b6b13d75.x86_64
          rpm -q clang-libs llvm-libs
          python -c 'import ctypes; ctypes.CDLL("libclang.so.21.1")'
          # Bindgen needs the distro library's resource headers.
          export BINDGEN_EXTRA_CLANG_ARGS='-resource-dir=/usr/lib/clang/21'
          test -f /usr/lib/clang/21/include/stddef.h
          command -v cc c++ readelf ldd
          cc --version
          c++ --version
          toolchain=$(python -c 'import json,re; v=json.load(open("target/python-source/receipt.json"))["source_builder_toolchain"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); print(v)')
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
          echo '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init' | sha256sum --check --strict
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain "$toolchain"
          export RUSTUP_TOOLCHAIN="$toolchain"
          git config --global --add safe.directory /io
          cmake --version
          nasm -v
          archives=(target/python-source/*.tar.gz)
          test "${#archives[@]}" = 1
          # The output mount exists; the helper exclusively creates its own child.
          scripts/dev/with-cargo-lock.sh python scripts/dev/check_python_binding.py \
            --release-candidate --target x86_64-unknown-linux-gnu --output /output/check \
            --source-archive "${archives[0]}" --source-receipt target/python-source/receipt.json \
            --additional-python /opt/python/cp315-cp315/bin/python
          mv /output/check/* /output/
          rmdir /output/check
          BUILD

      - name: Stop owned manylinux container and inspect package cache
        if: always() && runner.os == 'Linux'
        id: dnf-cache-state
        shell: bash
        env:
          MANYLINUX_CONTAINER: phantom-manylinux-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          container_id=$(docker container ls --all --quiet --filter "name=^/${MANYLINUX_CONTAINER}$")
          if [[ -n "$container_id" ]]; then
            docker container rm --force "$container_id"
          fi
          if [[ -d "$RUNNER_TEMP/phantom-dnf-cache" ]]; then
            cache_file=$(find "$RUNNER_TEMP/phantom-dnf-cache" -type f -print -quit)
            if [[ -n "$cache_file" ]]; then
              printf 'nonempty=true\n' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save manylinux package cache
        if: always() && runner.os == 'Linux' && steps.dnf-cache-state.outputs.nonempty == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/phantom-dnf-cache
          key: ${{ steps.dnf-cache.outputs.cache-primary-key }}

      - name: Upload verified wheel and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-python-${{ matrix.target }}
          path: target/python-wheel-candidate/verified/
          if-no-files-found: error

      - name: Retain build and installation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-python-logs-${{ matrix.target }}
          path: |
            target/python-wheel-candidate/logs/
            target/python-wheel-candidate/check/logs/
            target/python-wheel-candidate/dnf-logs/
          if-no-files-found: ignore

  ready:
    name: Python registry candidates
    needs: [source, candidate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-python-source
          path: target/python-registry/source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-python-x86_64-unknown-linux-gnu
          path: target/python-registry/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-python-x86_64-pc-windows-msvc
          path: target/python-registry/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phantom-python-aarch64-apple-darwin
          path: target/python-registry/macos
      - name: Require all consumers to verify this exact source
        run: >-
          python scripts/dev/check_python_binding.py
          --assemble-source target/python-registry/source
          --consumer target/python-registry/linux
          --consumer target/python-registry/windows
          --consumer target/python-registry/macos
          --output target/python-registry/verified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-python-registry-candidates
          path: target/python-registry/verified/
          if-no-files-found: error
