name: Python wheel candidates

on:
  pull_request:
    paths:
      - bindings/python/**
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/dev/check_python_binding.py
      - scripts/dev/tests/test_python_binding.py
      - scripts/dev/with-cargo-lock.sh
      - scripts/release/cli_artifact.py
      - scripts/release/notices/**
      - .github/workflows/python-wheels.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-wheel-candidates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  candidate:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            python-architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            python-architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          architecture: ${{ matrix.python-architecture }}

      - name: Install project toolchain
        run: rustc --version

      - name: Check wheel helper
        run: python -m unittest discover -s scripts/dev/tests -p test_python_binding.py

      - name: Build and verify optimized native wheel
        shell: bash
        env:
          WHEEL_TARGET: ${{ matrix.target }}
        run: |
          scripts/dev/with-cargo-lock.sh python scripts/dev/check_python_binding.py \
            --release-candidate --target "$WHEEL_TARGET" --output target/python-wheel-candidate

      - name: Upload verified wheel and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-python-${{ matrix.target }}
          path: target/python-wheel-candidate/verified/
          if-no-files-found: error

      - name: Retain build and installation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-python-logs-${{ matrix.target }}
          path: target/python-wheel-candidate/logs/
          if-no-files-found: ignore
