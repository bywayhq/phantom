name: BoringSSL native

on:
  # Pull requests run this suite only when a maintainer applies the
  # `conformance` label; see the job condition.
  pull_request:
    types: [labeled, reopened, synchronize]
  push:
    branches: [main]
    paths:
      - .github/workflows/boringssl-native.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - scripts/ci/check-boringssl-native.sh
      - vendor/btls/**
  schedule:
    - cron: "19 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CC: clang-18
  CMAKE_GENERATOR: Ninja
  CXX: clang++-18
  GOTOOLCHAIN: local

concurrency:
  # A run for an unrelated label gets its own group so it cannot cancel a
  # labeled run in progress.
  group: boringssl-native-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action == 'labeled' && github.event.label.name != 'conformance' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Native tests and BoGo
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'conformance')
      && (github.event.action != 'labeled' || github.event.label.name == 'conformance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.25.8"

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libunwind-dev ninja-build pkg-config
          cmake --version
          clang-18 --version
          go version
          ninja --version
          pkg-config --modversion libunwind-generic

      - name: Run native BoringSSL suite
        run: scripts/ci/check-boringssl-native.sh
