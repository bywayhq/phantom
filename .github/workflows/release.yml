name: Release

# Manual only. The package job lists every crate's contents; the publish job
# runs only when a maintainer disables the dry run, and only after the
# `crates-io` environment's required reviewers approve it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List package contents without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: List package contents
        run: scripts/release/publish-crates.sh --list

  publish:
    name: Publish
    needs: package
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Check native build prerequisites
        run: |
          for tool in git cmake clang c++; do
            command -v "$tool"
          done

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/release/publish-crates.sh --publish
