name: Release

on:
  pull_request:
    paths:
      - scripts/release/**
      - vendor/**
      - crates/**
      - tests/downstream/**
      - scripts/ci/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .gitattributes
      - LICENSE-*
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify release archives without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Packages (${{ matrix.runner }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [current, 1.88.0]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Install minimum supported Rust
        if: matrix.toolchain != 'current'
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install release tooling Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check release helpers
        run: python -m unittest discover -s scripts/release/tests

      - name: Verify packaged downstream installs
        shell: bash
        env:
          RELEASE_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          args=()
          if [[ "$RELEASE_TOOLCHAIN" != current ]]; then
            args+=(--toolchain "$RELEASE_TOOLCHAIN")
          fi
          scripts/release/publish-crates.sh --verify --output target/release-check "${args[@]}"

      - name: Retain package identities and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.runner }}-${{ matrix.toolchain }}
          path: |
            target/release-check/archives.json
            target/release-check/logs/
            target/release-check/metadata.json
            target/release-check/consumer/Cargo.lock
            target/release-check/registry/
            target/release-check/cli-install/.crates2.json
          if-no-files-found: error

  advisories:
    name: Upstream dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Install release tooling Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      - name: Check upstream identities of renamed dependencies
        run: scripts/dev/with-cargo-lock.sh python3 scripts/release/check-advisories.py --output target/release-advisories

      - name: Retain advisory report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-advisories
          path: target/release-advisories/
          if-no-files-found: error

  publish:
    name: Publish and verify Byway ownership
    needs: [package, advisories]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Install release tooling Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check names and existing ownership
        run: scripts/release/publish-crates.sh --preflight

      - name: Publish packages and establish Byway team ownership
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/release/publish-crates.sh --publish

      - name: Verify registry-only installation
        shell: bash
        run: |
          version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])')
          scripts/dev/with-cargo-lock.sh scripts/ci/check-downstream.sh registry "$version"
