name: WPT EventSource conformance

on:
  # Pull requests run this suite only when a maintainer applies the
  # `conformance` label; see the job condition.
  pull_request:
    types: [labeled, reopened, synchronize]
  push:
    branches: [main]
    paths:
      - .github/workflows/wpt-eventsource.yml
      - Cargo.lock
      - Cargo.toml
      - crates/phantom/Cargo.toml
      - crates/phantom/examples/wpt_eventsource/**
      - crates/phantom/src/**
      - crates/phantom-net/**
      - crates/phantom-profile/**
      - scripts/conformance/**
  schedule:
    - cron: "17 9 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: EventSource case set
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  # A run for an unrelated label gets its own group so it cannot cancel a
  # labeled run in progress.
  group: wpt-eventsource-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.mode || 'automatic' }}-${{ github.event.action == 'labeled' && github.event.label.name != 'conformance' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  conformance:
    name: ${{ matrix.name }} ${{ github.event_name == 'schedule' && 'full' || 'selected' }} suite
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'conformance')
      && (github.event.action != 'labeled' || github.event.label.name == 'conformance'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Check runner prerequisites
        run: |
          command -v git
          command -v openssl

      - name: Select case set
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=smoke
          if [[ "$EVENT_NAME" == schedule ]]; then
            mode=full
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            mode="$DISPATCH_MODE"
          fi
          echo "WPT_EVENTSOURCE_MODE=$mode" >> "$GITHUB_ENV"

      - name: Run pinned EventSource scenarios
        run: python3 scripts/conformance/wpt_eventsource.py "$WPT_EVENTSOURCE_MODE"

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpt-eventsource-${{ matrix.name }}-${{ env.WPT_EVENTSOURCE_MODE }}-${{ github.sha }}
          path: |
            target/wpt-eventsource/**/adapter.log
            target/wpt-eventsource/**/case-manifest.json
            target/wpt-eventsource/**/metadata.json
            target/wpt-eventsource/**/server.log
            target/wpt-eventsource/**/summary.json
          if-no-files-found: warn
          retention-days: 30
