name: CLI artifacts

on:
  pull_request:
    paths:
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/release/**
      - scripts/dev/tests/test_cli_artifact.py
      - scripts/dev/with-cargo-lock.sh
      - .github/workflows/cli-artifacts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  archive:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project toolchain
        run: rustc --version

      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --version=2.16.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM installation failed" }
          $nasmDirectory = (Get-Item -LiteralPath 'HKCU:\Software\nasm').GetValue('')
          if (-not (Test-Path -LiteralPath (Join-Path $nasmDirectory 'nasm.exe'))) { throw "NASM executable is missing" }
          $env:PATH = "$nasmDirectory;$env:PATH"
          $nasmDirectory >> $env:GITHUB_PATH
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw "NASM is unavailable" }

      - name: Check artifact helper
        run: python -m unittest discover -s scripts/dev/tests -p test_cli_artifact.py

      - name: Build and check extracted CLI
        shell: bash
        env:
          ARTIFACT_TARGET: ${{ matrix.target }}
        run: |
          scripts/dev/with-cargo-lock.sh python scripts/release/cli_artifact.py \
            --target "$ARTIFACT_TARGET" --output target/cli-artifact

      - name: Upload verified CLI archive and receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-cli-${{ matrix.target }}
          path: target/cli-artifact/verified/
          if-no-files-found: error

      - name: Retain build and installation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-cli-logs-${{ matrix.target }}
          path: target/cli-artifact/logs/
          if-no-files-found: ignore
