name: CI

# Pull requests run the Linux jobs; the macOS and Windows platform jobs run on
# pushes to main, the weekly schedule, and manual dispatch. Documentation-only
# changes skip every job except the ones they can affect. The `CI required`
# job is the single status check that branch protection requires.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# Every push run gets its own group so none is cancelled or replaced while
# pending: a push run classifies only the commits since the previous push, so
# losing one would leave its commits untested. Pull request runs cancel the
# older run for the same pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      doctests: ${{ steps.classify.outputs.doctests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          everything=$'code=true\ndoctests=true'
          case "$EVENT_NAME" in
            pull_request)
              # The checkout is GitHub's test merge commit; its first parent
              # is the base branch.
              classes=$(scripts/ci/changed-paths.sh HEAD^1 HEAD)
              ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] &&
                git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"; then
                classes=$(scripts/ci/changed-paths.sh "$PUSH_BEFORE" HEAD)
              else
                echo "::notice::Previous main commit is unavailable; running every job"
                classes=$everything
              fi
              ;;
            *)
              classes=$everything
              ;;
          esac
          printf '%s\n' "$classes"
          printf '%s\n' "$classes" >>"$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.doctests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check native build prerequisites
        run: |
          for tool in git cmake clang c++ nm objcopy; do
            command -v "$tool"
          done

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install Python tooling
        run: |
          python -m pip install --disable-pip-version-check             --require-hashes --requirement scripts/requirements.txt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"

      - name: Lint shell scripts
        run: shellcheck scripts/ci/*.sh scripts/release/*.sh

      - name: Lint capture tooling
        run: |
          ruff check scripts/capture scripts/conformance
          ruff format --check scripts/capture scripts/conformance

      - name: Test protocol tooling
        run: |
          python -m unittest discover -s scripts/capture/tests -p 'test_*.py'
          python -m unittest discover -s scripts/conformance/tests -p 'test_*.py'

      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Test dependency-maintenance tooling
        run: scripts/ci/test-upstream-freshness.sh

      - name: Test CI path classification
        run: scripts/ci/test-changed-paths.sh

  features:
    name: Features
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check native build prerequisites
        run: |
          for tool in git cmake clang c++ nm objcopy; do
            command -v "$tool"
          done

      - name: Check optional feature matrix
        run: |
          cargo check -p phantom-http --no-default-features --locked
          cargo check -p phantom-http --no-default-features --features cookies --locked
          cargo check -p phantom-http --no-default-features --features sse --locked
          cargo check -p phantom-http --no-default-features --features websocket --locked
          cargo check -p phantom-http --no-default-features --features websocket-deflate --locked
          cargo check -p phantom-http --no-default-features --features cookies,sse --locked
          cargo check -p phantom-http --no-default-features --features cookies,websocket --locked
          cargo check -p phantom-http --no-default-features --features cookies,websocket-deflate --locked
          cargo check -p phantom-http --no-default-features --features sse,websocket --locked
          cargo check -p phantom-http --all-features --locked
          cargo check -p phantom-net --no-default-features --locked
          cargo check -p phantom-net --no-default-features --features qlog --locked
          cargo check -p phantom-quic-btls --no-default-features --locked
          cargo check -p phantom-quic-btls --no-default-features --features keylog --locked

  downstream:
    name: Downstream
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Check native build prerequisites
        run: |
          for tool in git cmake clang c++ python3; do
            command -v "$tool"
          done

      - name: Install cargo-deny
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@0.19.6

      - name: Check dependency bans and advisories
        run: cargo deny --locked check bans advisories

      - name: Check path and git downstream consumers
        run: scripts/ci/check-downstream.sh path git

  vendor:
    name: Vendor (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - btls
          - h3
          - http2
          - quinn
          - quinn-proto
          - tokio-btls
          - tokio-tungstenite
          - tungstenite
          - wreq-proto
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Check native build prerequisites
        run: |
          for tool in git cmake clang c++ nm objcopy; do
            command -v "$tool"
          done

      - name: Install minimum supported Rust
        if: matrix.package == 'btls'
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check vendored package
        run: scripts/ci/check-vendor.sh "${{ matrix.package }}"

  platform:
    name: Platform (${{ matrix.name }})
    needs: changes
    # Pull requests skip the macOS and Windows runners; Linux coverage is in
    # the other jobs.
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check native build prerequisites on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for tool in git cmake clang c++ xcrun; do
            command -v "$tool"
          done
          xcrun --find clang

      - name: Check native build prerequisites on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "git", "cmake", "clang", "nasm" | ForEach-Object {
            Get-Command $_ -ErrorAction Stop | Select-Object -ExpandProperty Source
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio installer discovery tool was not found"
          }
          $installation = & $vswhere -latest `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "Visual C++ build tools were not found"
          }
          $installation

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Test native QUIC crypto release link
        run: cargo test --release -p phantom-quic-btls --lib --locked

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check native clients on minimum supported Rust
        run: cargo +1.85.0 check -p phantom-net -p phantom-quic-btls --all-targets --locked

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        run: |
          msrv=$(sed -nE 's/^rust-version = "([^"]+)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check workspace
        run: cargo "+$MSRV" check --workspace --all-targets --locked

      - name: Check optional features
        run: |
          cargo "+$MSRV" check -p phantom-http --no-default-features --features cookies --locked
          cargo "+$MSRV" check -p phantom-http --no-default-features --features sse --locked
          cargo "+$MSRV" check -p phantom-http --no-default-features --features websocket --locked
          cargo "+$MSRV" check -p phantom-http --no-default-features --features websocket-deflate --locked
          cargo "+$MSRV" check -p phantom-http --no-default-features --features cookies,sse --locked
          cargo "+$MSRV" check -p phantom-http --no-default-features --features cookies,websocket --locked
          cargo "+$MSRV" check -p phantom-http --no-default-features --features cookies,websocket-deflate --locked
          cargo "+$MSRV" check -p phantom-http --no-default-features --features sse,websocket --locked
          cargo "+$MSRV" check -p phantom-http --all-features --locked
          cargo "+$MSRV" check -p phantom-net --no-default-features --features qlog --locked
          cargo "+$MSRV" check -p phantom-quic-btls --no-default-features --features keylog --locked

  # The one status check branch protection requires. It must list every other
  # job in `needs`. It runs even when a needed job fails or the run is
  # cancelled, because GitHub treats a skipped required check as passing.
  required:
    name: CI required
    needs: [changes, quality, features, downstream, vendor, platform, msrv]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # A job skipped by its own condition is expected. Any other result,
          # or a missing classification that would have skipped jobs, fails.
          jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq --exit-status '
            .changes.result == "success"
            and (.changes.outputs.code | IN("true", "false"))
            and (.changes.outputs.doctests | IN("true", "false"))
            and all(.[]; .result == "success" or .result == "skipped")
          ' <<<"$NEEDS" >/dev/null
