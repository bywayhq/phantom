name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Check native build prerequisites
        run: |
          for tool in git cmake clang c++ nm objcopy; do
            command -v "$tool"
          done

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Python tooling
        run: >-
          python -m pip install --disable-pip-version-check
          aioquic==1.3.0 ruff==0.16.7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint capture tooling
        run: |
          ruff check scripts/capture
          ruff format --check scripts/capture

      - name: Test capture tooling
        run: python -m unittest discover -s scripts/capture/tests -p 'test_*.py'

      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Test dependency-maintenance tooling
        run: scripts/ci/test-upstream-freshness.sh

  vendor:
    name: Vendor (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [btls, http2, quinn-proto, h3]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Check native build prerequisites
        run: |
          for tool in git cmake clang c++ nm objcopy; do
            command -v "$tool"
          done

      - name: Check vendored package
        run: scripts/ci/check-vendor.sh "${{ matrix.package }}"

  platform:
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version

      - name: Check native build prerequisites on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for tool in git cmake clang c++ xcrun; do
            command -v "$tool"
          done
          xcrun --find clang

      - name: Check native build prerequisites on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "git", "cmake", "clang", "nasm" | ForEach-Object {
            Get-Command $_ -ErrorAction Stop | Select-Object -ExpandProperty Source
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio installer discovery tool was not found"
          }
          $installation = & $vswhere -latest `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "Visual C++ build tools were not found"
          }
          $installation

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Test native QUIC crypto release link
        run: cargo test --release -p phantom-quic-btls --lib --locked

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check native clients on minimum supported Rust
        run: cargo +1.85.0 check -p phantom-net -p phantom-quic-btls --all-targets --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        run: |
          msrv=$(sed -nE 's/^rust-version = "([^"]+)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Check workspace
        run: cargo "+$MSRV" check --workspace --all-targets --locked
