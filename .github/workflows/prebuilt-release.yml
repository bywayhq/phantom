name: Promote prebuilt Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable Release tag (vX.Y.Z)
        required: true
        type: string
      cli_run:
        description: Successful manually dispatched CLI candidate run ID
        required: true
        type: string
      python_run:
        description: Successful manually dispatched Python candidate run ID
        required: true
        type: string
      node_run:
        description: Successful manually dispatched Node candidate run ID
        required: true
        type: string
      go_run:
        description: Successful manually dispatched Go candidate run ID
        required: true
        type: string
      publish:
        description: Upload validated bytes to the selected Release (no overwrite)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: prebuilt-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  CLI_RUN: ${{ inputs.cli_run }}
  PYTHON_RUN: ${{ inputs.python_run }}
  NODE_RUN: ${{ inputs.node_run }}
  GO_RUN: ${{ inputs.go_run }}

jobs:
  validate:
    if: github.repository == 'bywayhq/phantom' && github.ref == 'refs/heads/main' && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out promotion code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check promotion failure controls
        run: python -m unittest discover -s scripts/release/tests -p test_promote_prebuilds.py
      - name: Validate candidates without changing the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/promote_prebuilds.py --tag "$RELEASE_TAG" \
            --cli-run "$CLI_RUN" --python-run "$PYTHON_RUN" \
            --node-run "$NODE_RUN" --go-run "$GO_RUN" --output target/prebuilt-release
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-release-validation
          path: |
            target/prebuilt-release/logs/
            target/prebuilt-release/verified/
          if-no-files-found: ignore

  promote:
    if: github.repository == 'bywayhq/phantom' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out promotion code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check promotion failure controls
        run: python -m unittest discover -s scripts/release/tests -p test_promote_prebuilds.py
      - name: Validate and upload without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/promote_prebuilds.py --tag "$RELEASE_TAG" \
            --cli-run "$CLI_RUN" --python-run "$PYTHON_RUN" \
            --node-run "$NODE_RUN" --go-run "$GO_RUN" --output target/prebuilt-release --publish
      - name: Retain promotion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-release-promotion
          path: |
            target/prebuilt-release/logs/
            target/prebuilt-release/verified/
          if-no-files-found: ignore
