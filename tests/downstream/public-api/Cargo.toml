[package]
name = "phantom-public-api-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
https-records = ["phantom/https-records"]
json = ["phantom/json"]

[dependencies]
phantom = { package = "phantom-http", path = "../../../crates/phantom" }

[dev-dependencies]
phantom-testkit = { path = "../../../crates/phantom-testkit" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "time"] }
