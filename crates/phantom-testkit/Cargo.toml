[package]
name = "phantom-testkit"
description = "Deterministic wire capture helpers for Phantom tests"
keywords = ["http", "testing", "wire", "tls"]
categories = ["development-tools::testing", "network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "README.md"

[dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "test-util", "time"] }

[lints]
workspace = true
