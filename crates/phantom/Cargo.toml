[package]
name = "phantom"
description = "A wire-evidenced browser-compatible HTTP client"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
bytes.workspace = true
http = "1.4.0"
http-body = "1.0.1"
phantom-net = { path = "../phantom-net" }
phantom-profile = { path = "../phantom-profile" }
tracing = "0.1.41"

[dev-dependencies]
btls.workspace = true
h3 = { workspace = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn.workspace = true
http-body-util = "0.1.3"
http2 = { version = "=0.5.20", features = ["unstable"] }
quinn = { workspace = true, features = ["rustls-ring"] }
rcgen = "=0.14.5"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-btls.workspace = true

[lints]
workspace = true
