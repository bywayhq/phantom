[package]
name = "phantom"
description = "A wire-evidenced browser-compatible HTTP client"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[features]
default = []
cookies = ["dep:cookie", "dep:cookie_store", "dep:parking_lot", "dep:psl", "dep:url"]
full = ["cookies", "sse", "websocket"]
sse = []
websocket = ["dep:btls", "dep:futures-util", "dep:tokio-tungstenite"]

[dependencies]
btls = { workspace = true, optional = true }
bytes.workspace = true
cookie = { version = "=0.18.2", optional = true }
cookie_store = { version = "=0.22.0", optional = true, default-features = false }
http = "1.4.0"
http-body = "1.0.1"
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["sink", "std"] }
parking_lot = { version = "=0.12.5", optional = true }
phantom-net = { path = "../phantom-net" }
phantom-profile = { path = "../phantom-profile" }
psl = { version = "=2.1.232", optional = true }
tokio = { version = "1.53.1", features = ["sync"] }
tokio-tungstenite = { version = "=0.30.0", optional = true, default-features = false }
tracing = "0.1.41"
url = { version = "=2.5.8", optional = true }

[dev-dependencies]
btls.workspace = true
h3 = { workspace = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn.workspace = true
http-body-util = "0.1.3"
http2 = { version = "=0.5.20", features = ["unstable"] }
quinn = { workspace = true, features = ["rustls-ring"] }
rcgen = "=0.14.5"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-btls.workspace = true

[lints]
workspace = true
