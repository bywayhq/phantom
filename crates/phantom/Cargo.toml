[package]
name = "phantom-http"
description = "A wire-evidenced browser-compatible HTTP client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The package name `phantom` is taken on crates.io; the library keeps the
# `phantom` crate name.
[lib]
name = "phantom"

[features]
default = []
cookies = ["dep:cookie", "dep:cookie_store", "dep:parking_lot", "dep:psl"]
full = ["cookies", "sse", "websocket-deflate"]
sse = ["tokio/time"]
websocket = ["dep:btls", "dep:futures-util", "dep:tokio-tungstenite"]
websocket-deflate = ["websocket", "dep:tungstenite", "tungstenite/deflate"]

[dependencies]
btls = { workspace = true, optional = true }
brotli.workspace = true
bytes.workspace = true
cookie = { version = "=0.18.2", optional = true }
cookie_store = { version = "=0.22.0", optional = true, default-features = false }
flate2.workspace = true
http = "1.4.0"
http-body = "1.0.1"
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["sink", "std"] }
parking_lot = { version = "=0.12.5", optional = true }
phantom-net = { version = "=0.1.0", path = "../phantom-net" }
phantom-profile = { version = "=0.1.0", path = "../phantom-profile" }
psl = { version = "=2.1.232", optional = true }
sfv.workspace = true
tokio = { version = "1.53.1", features = ["sync", "time"] }
tokio-tungstenite = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }
tracing = "0.1.41"
url = "=2.5.8"
zstd.workspace = true

[dev-dependencies]
btls.workspace = true
h3 = { workspace = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn.workspace = true
http-body-util = "0.1.3"
http2 = { workspace = true, features = ["unstable"] }
quinn = { workspace = true, features = ["rustls-ring"] }
rcgen = "=0.14.5"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
tokio-btls.workspace = true

[lints]
workspace = true

[[example]]
name = "autobahn-client"
path = "examples/autobahn_client.rs"
required-features = ["websocket-deflate"]

[[example]]
name = "wpt-eventsource-client"
path = "examples/wpt_eventsource/main.rs"
required-features = ["sse"]

[[example]]
name = "quic-interop-client"
path = "examples/quic_interop/main.rs"
