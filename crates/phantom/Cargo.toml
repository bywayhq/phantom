[package]
name = "phantom-http"
autotests = false
description = "HTTP client with browser TLS and HTTP profiles"
readme = "../../README.md"
keywords = ["http", "browser", "tls", "http2", "http3"]
categories = ["web-programming::http-client", "network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# The package name `phantom` is taken on crates.io; the library keeps the
# `phantom` crate name.
[lib]
name = "phantom"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
charset = ["dep:encoding_rs"]
cookies = ["dep:cookie", "dep:cookie_store", "dep:parking_lot", "dep:psl"]
danger-disable-verification = ["phantom-net/danger-disable-verification"]
diagnostics = ["phantom-net/keylog", "phantom-net/qlog"]
fingerprint-import = ["dep:serde", "dep:serde_json"]
full = ["charset", "cookies", "fingerprint-import", "https-records", "json", "serde", "session-snapshot", "sse", "websocket-deflate", "xml"]
fuzzing = ["sse"]
https-records = ["phantom-net/https-records", "dep:base64"]
json = ["dep:serde", "dep:serde_json"]
serde = ["dep:serde"]
session-snapshot = []
sse = ["dep:futures-core", "tokio/time"]
websocket = ["dep:futures-util", "dep:tokio-tungstenite"]
websocket-deflate = ["websocket", "dep:tungstenite", "tungstenite/deflate"]
xml = ["dep:quick-xml", "dep:serde"]

[dependencies]
base64 = { version = "=0.23.1", optional = true }
btls.workspace = true
brotli.workspace = true
bytes.workspace = true
cookie = { version = "=0.18.2", optional = true }
cookie_store = { version = "=0.22.1", optional = true, default-features = false }
encoding_rs = { version = "=0.8.42", optional = true }
flate2.workspace = true
fastrand = "=2.5.0"
http = "1.4.0"
http-body = "1.1.0"
httparse = "1.10.1"
futures-core = { version = "=0.3.34", optional = true, default-features = false }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["sink", "std"] }
parking_lot = { version = "=0.12.5", optional = true }
phantom-net = { version = "=0.4.0", path = "../phantom-net" }
phantom-profile = { version = "=0.4.0", path = "../phantom-profile" }
pin-project-lite = "=0.2.17"
psl = { version = "=2.1.243", optional = true }
quick-xml = { version = "=0.42.0", optional = true, default-features = false, features = ["serialize"] }
serde = { workspace = true, optional = true }
serde_json = { version = "1.0.151", optional = true }
sfv.workspace = true
tokio = { version = "1.53.1", features = ["io-util", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }
tracing = "0.1.41"
url = "^2.5.8"
zeroize.workspace = true
zstd.workspace = true

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
h3 = { workspace = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn.workspace = true
http-body-util = "0.1.3"
http2 = { workspace = true, features = ["unstable"] }
phantom-quic-btls = { version = "=0.4.0", path = "../phantom-quic-btls", features = ["server"] }
phantom-testkit = { version = "=0.4.0", path = "../phantom-testkit" }
quinn = { workspace = true, features = ["rustls-ring"] }
rcgen = "=0.14.10"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-btls.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }

[lints]
workspace = true

[[test]]
name = "requests"
path = "tests/requests/main.rs"

[[test]]
name = "sessions"
path = "tests/sessions/main.rs"

[[test]]
name = "proxies"
path = "tests/proxies/main.rs"

[[test]]
name = "http3"
path = "tests/http3/main.rs"

[[test]]
name = "streams"
path = "tests/streams/main.rs"

[[example]]
name = "autobahn-client"
path = "examples/autobahn_client.rs"
required-features = ["websocket-deflate"]

[[example]]
name = "wpt-eventsource-client"
path = "examples/wpt_eventsource/main.rs"
required-features = ["sse"]

[[example]]
name = "quic-interop-client"
path = "examples/quic_interop/main.rs"

[[example]]
name = "first-request"
path = "examples/first_request.rs"

[[example]]
name = "request-template"
path = "examples/request_template.rs"

[[example]]
name = "json"
path = "examples/json.rs"
required-features = ["json"]

[[example]]
name = "proxy"
path = "examples/proxy.rs"

[[example]]
name = "http3"
path = "examples/http3.rs"

[[example]]
name = "cookies"
path = "examples/cookies.rs"
required-features = ["cookies"]

[[example]]
name = "sse"
path = "examples/sse.rs"
required-features = ["sse"]

[[example]]
name = "websocket"
path = "examples/websocket.rs"
required-features = ["websocket"]
