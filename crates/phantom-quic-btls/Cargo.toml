[package]
name = "phantom-quic-btls"
description = "Private BoringSSL cryptography primitives for Phantom QUIC"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
bytes.workspace = true
foreign-types = "=0.5.0"
phantom-profile = { path = "../phantom-profile" }
quinn-proto.workspace = true
rustls-pki-types = "=1.15.1"
zeroize.workspace = true

# This btls revision skips archive rewriting on Apple/Windows but still
# rewrites generated link names, causing unresolved build-script symbols.
[target.'cfg(any(target_vendor = "apple", target_os = "windows"))'.dependencies]
btls.workspace = true
btls-sys.workspace = true

[target.'cfg(not(any(target_vendor = "apple", target_os = "windows")))'.dependencies]
btls = { workspace = true, features = ["prefix-symbols"] }
btls-sys = { workspace = true, features = ["prefix-symbols"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "warn"
