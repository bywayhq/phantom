[package]
name = "phantom-net"
description = "Protocol transports for Phantom"
readme = "README.md"
keywords = ["http", "tls", "quic", "proxy"]
categories = ["network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# `ServerAuthentication::DangerDisabled`, which accepts any server certificate.
danger-disable-verification = []
# HTTPS DNS record (RFC 9460) lookups through hickory-resolver.
https-records = ["dep:hickory-resolver"]
keylog = ["phantom-quic-btls/keylog"]
qlog = ["quinn/qlog"]

[dependencies]
brotli.workspace = true
bytes = "1.12.1"
flate2.workspace = true
h3.workspace = true
h3-datagram.workspace = true
h3-quinn.workspace = true
hickory-resolver = { version = "0.26.3", optional = true, default-features = false, features = ["system-config", "tokio"] }
http = "1.4.0"
http2 = { workspace = true, features = ["unstable"] }
http-body = "1.0.1"
http-body-util = "0.1.3"
httparse = "1.10.1"
phantom-profile = { version = "=0.1.0", path = "../phantom-profile" }
phantom-quic-btls = { version = "=0.1.0", path = "../phantom-quic-btls" }
quinn.workspace = true
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-socks = { version = "=0.5.3", default-features = false, features = ["tokio"] }
tracing = "0.1.41"
url = "=2.5.8"
webpki-root-certs = "1.0.9"
wreq-proto.workspace = true
zeroize.workspace = true
zstd.workspace = true

# This btls revision skips archive rewriting on Apple/Windows but still rewrites
# generated link names, causing unresolved `build_script_main_*` symbols.
[target.'cfg(any(target_vendor = "apple", target_os = "windows"))'.dependencies]
btls.workspace = true
tokio-btls.workspace = true

[target.'cfg(not(any(target_vendor = "apple", target_os = "windows")))'.dependencies]
btls = { workspace = true, features = ["prefix-symbols"] }
tokio-btls = { workspace = true, features = ["prefix-symbols"] }

# `if_nametoindex`, which turns an interface name into the index that
# Apple's `IP_BOUND_IF` takes. socket2 and Tokio already build this version on
# these targets.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.189"

# The Winsock, IP Helper, and ntdll declarations behind `SO_RANDOMIZE_PORT`
# and `IP_UNICAST_IF`. socket2 and Tokio already build this version on
# Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_SystemInformation"] }

# Linux and Android tests run the Apple `if_nametoindex` lookup.
[target.'cfg(any(target_os = "android", target_os = "linux"))'.dev-dependencies]
libc = "0.2.189"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
h3 = { workspace = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
phantom-quic-btls = { version = "=0.1.0", path = "../phantom-quic-btls", features = ["server"] }
phantom-testkit = { path = "../phantom-testkit" }
quinn = { workspace = true, features = ["rustls-ring"] }
quinn-proto.workspace = true
rcgen = "=0.14.10"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "transport"
harness = false

[[example]]
name = "tls_anvil_client"
required-features = ["danger-disable-verification"]

# The workspace lints, except that unsafe code is denied rather than forbidden
# so the private `socket_ffi` FFI module can allow it.
[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "warn"
