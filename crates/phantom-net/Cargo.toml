[package]
name = "phantom-net"
description = "Protocol transports for Phantom"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
btls.workspace = true
brotli = "8.0.4"
bytes = "1.12.1"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
tokio = { version = "1.53.1", features = ["rt"] }
tokio-btls.workspace = true
tracing = "0.1.41"
wreq-proto = "=0.2.5"

[dev-dependencies]
phantom-testkit = { path = "../phantom-testkit" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[lints]
workspace = true
