[package]
name = "phantom-h3"
version = "0.0.8-phantom.3"
rust-version = "1.74"
authors = [
    "Sean McArthur <sean@seanmonstar.com>",
    "Jean-Christophe BEGUE <jc.begue@pm.me>",
]
license = "MIT"
edition = "2021"
repository = "https://github.com/bywayhq/phantom"
readme = "../README.md"
description = "Phantom fork of h3 0.0.8; not a general-purpose replacement"
keywords = ["http3", "quic", "h3"]
categories = [
    "network-programming",
    "web-programming::http-client",
    "web-programming::http-server",
]
exclude = [
    ".cargo_vcs_info.json",
    ".cargo-ok",
    "Cargo.toml.orig",
]

[package.metadata.phantom]
upstream-package = "h3"
upstream-version = "0.0.8"
upstream-source = "https://codeload.github.com/hyperium/h3/tar.gz/1f3d5295833ad454343f25d55633fb6bee1027b2"

[features]
i-implement-a-third-party-backend-and-opt-into-breaking-changes = []
tracing = ["dep:tracing"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["io"] }
http = "1"
tokio = { version = "1", features = ["sync"] }
pin-project-lite = { version = "0.2", default-features = false }
tracing = {version = "0.1.40", optional = true}
fastrand = "2.0.1"

[dev-dependencies]
assert_matches = "1.5.0"
futures-util = { version = "0.3", default-features = false, features = ["io"] }
proptest = "1"
quinn = { package = "phantom-quinn", version = "=0.11.12-phantom.1", path = "../../quinn", default-features = false, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
quinn-proto = { package = "phantom-quinn-proto", version = "=0.11.18-phantom.1", path = "../../quinn-proto", default-features = false }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "env-filter",
    "time",
    "tracing-log",
] }
futures = { version = "0.3.28" }
tokio-util = { version = "0.7.9" }
h3-datagram = { package = "phantom-h3-datagram", version = "=0.0.2-phantom.3", path = "../h3-datagram" }

[lib]
name = "h3"
