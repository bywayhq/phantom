[package]
name = "phantom-h3-quinn"
version = "0.0.10-phantom.1"
rust-version = "1.74"
authors = ["Jean-Christophe BEGUE <jc.begue@pm.me>"]
edition = "2021"
repository = "https://github.com/bywayhq/phantom"
readme = "README.md"
description = "Phantom fork of h3-quinn 0.0.10; not a general-purpose replacement"
keywords = ["http3", "quic", "h3"]
categories = ["network-programming", "web-programming"]
license = "MIT"
exclude = [
    ".cargo_vcs_info.json",
    ".cargo-ok",
    "Cargo.toml.orig",
]

[package.metadata.phantom]
upstream-package = "h3-quinn"
upstream-version = "0.0.10"
upstream-source = "https://codeload.github.com/hyperium/h3/tar.gz/1f3d5295833ad454343f25d55633fb6bee1027b2"

[dependencies]
h3 = { package = "phantom-h3", version = "=0.0.8-phantom.1", path = "../h3" }
bytes = "1"
quinn = { package = "phantom-quinn", version = "=0.11.12-phantom.1", path = "../../quinn", default-features = false, features = [
    "futures-io",
] }
tokio-util = { version = "0.7.9" }
futures-util = { version = "0.3.28", default-features = false }
h3-datagram = { package = "phantom-h3-datagram", version = "=0.0.2-phantom.1", path = "../h3-datagram", optional = true }
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]
datagram = ["dep:h3-datagram"]

[lib]
name = "h3_quinn"
