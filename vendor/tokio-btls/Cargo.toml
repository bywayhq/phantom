[package]
name = "phantom-tokio-btls"
version = "0.5.6-phantom.1"
authors = ["0x676e67 <gngppz@gmail.com>", "Alex Crichton <alex@alexcrichton.com>", "Ivan Nikulin <ifaaan@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/bywayhq/phantom"
homepage = "https://github.com/0x676e67/btls"
description = "Phantom fork of tokio-btls 0.5.6; not a general-purpose replacement"
exclude = [
    ".cargo_vcs_info.json",
    ".cargo-ok",
    "Cargo.toml.orig",
]

[package.metadata.phantom]
upstream-package = "tokio-btls"
upstream-version = "0.5.6"
upstream-source = "https://codeload.github.com/0xARYA/btls/tar.gz/ce81167653e2d8878f2e9b2218a15b9bc8351a53"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["btls/default"]

# Use a FIPS-validated version of boringssl.
fips = ["btls/fips"]

# Enables Raw public key API (https://datatracker.ietf.org/doc/html/rfc7250)
rpk = ["btls/rpk"]

# Add a prefix to all symbols in libcrypto and libssl to prevent conflicts
# with OpenSSL versions that might be linked in the same process.
prefix-symbols = ["btls/prefix-symbols"]

[dependencies]
btls = { package = "phantom-btls", version = "=0.5.6-phantom.1", path = "../btls" }
tokio = "1.52.1"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.52.1", features = [ "full" ] }
anyhow = "1"

[lib]
name = "tokio_btls"
