[workspace]
members = [
    "crates/phantom",
    "crates/phantom-net",
    "crates/phantom-profile",
    "crates/phantom-quic-btls",
    "crates/phantom-testkit",
]
exclude = [
    "fuzz",
    "vendor/btls",
    "vendor/http2",
    "vendor/quinn-proto",
    "vendor/tungstenite",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
btls = { git = "https://github.com/0xARYA/btls", rev = "78b8c24a3388973d1d33c523995d311d766a1026", default-features = false }
btls-sys = { git = "https://github.com/0xARYA/btls", rev = "78b8c24a3388973d1d33c523995d311d766a1026", default-features = false }
bytes = "=1.12.1"
h3 = { version = "=0.0.8", default-features = false, features = ["tracing"] }
h3-datagram = { version = "=0.0.2", default-features = false, features = ["tracing"] }
h3-quinn = { version = "=0.0.10", default-features = false, features = ["datagram", "tracing"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio"] }
quinn-proto = { version = "=0.11.18", default-features = false }
sfv = "=0.15.0"
tokio-btls = { git = "https://github.com/0xARYA/btls", rev = "78b8c24a3388973d1d33c523995d311d766a1026", default-features = false }
zeroize = "=1.9.0"

[patch.crates-io]
h3 = { path = "vendor/h3/h3" }
h3-datagram = { path = "vendor/h3/h3-datagram" }
h3-quinn = { path = "vendor/h3/h3-quinn" }
http2 = { path = "vendor/http2" }
quinn-proto = { path = "vendor/quinn-proto" }
tungstenite = { path = "vendor/tungstenite" }

[patch."https://github.com/0xARYA/btls"]
btls = { path = "vendor/btls" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[profile.bench]
debug = 1
