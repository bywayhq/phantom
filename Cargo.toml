[workspace]
members = [
    "crates/phantom",
    "crates/phantom-net",
    "crates/phantom-profile",
    "crates/phantom-quic-btls",
    "crates/phantom-testkit",
]
exclude = [
    "fuzz",
    "vendor/btls",
    "vendor/h3",
    "vendor/http2",
    "vendor/quinn",
    "vendor/quinn-proto",
    "vendor/tokio-btls",
    "vendor/tokio-tungstenite",
    "vendor/tungstenite",
    "vendor/wreq-proto",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bywayhq/phantom"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
# Patched dependencies resolve to Phantom's renamed forks under `vendor/`. The
# dependency keys keep the upstream crate names, so source code is unchanged
# and the stock packages never enter the build graph. See docs/guides/downstream.md.
btls = { package = "phantom-btls", version = "=0.5.6-phantom.3", path = "vendor/btls", default-features = false }
btls-sys = { git = "https://github.com/bywayhq/btls", rev = "ce81167653e2d8878f2e9b2218a15b9bc8351a53", default-features = false }
brotli = "9.0.0"
bytes = "=1.12.1"
flate2 = "1.1.9"
h3 = { package = "phantom-h3", version = "=0.0.8-phantom.4", path = "vendor/h3/h3", default-features = false, features = ["tracing"] }
h3-datagram = { package = "phantom-h3-datagram", version = "=0.0.2-phantom.4", path = "vendor/h3/h3-datagram", default-features = false, features = ["tracing"] }
h3-quinn = { package = "phantom-h3-quinn", version = "=0.0.10-phantom.4", path = "vendor/h3/h3-quinn", default-features = false, features = ["datagram", "tracing"] }
http2 = { package = "phantom-http2", version = "=0.5.20-phantom.4", path = "vendor/http2" }
quinn = { package = "phantom-quinn", version = "=0.11.12-phantom.1", path = "vendor/quinn", default-features = false, features = ["runtime-tokio"] }
quinn-proto = { package = "phantom-quinn-proto", version = "=0.11.18-phantom.1", path = "vendor/quinn-proto", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
sfv = "=0.15.0"
tokio-btls = { package = "phantom-tokio-btls", version = "=0.5.6-phantom.3", path = "vendor/tokio-btls", default-features = false }
tokio-tungstenite = { package = "phantom-tokio-tungstenite", version = "=0.30.0-phantom.1", path = "vendor/tokio-tungstenite", default-features = false }
tungstenite = { package = "phantom-tungstenite", version = "=0.30.0-phantom.1", path = "vendor/tungstenite", default-features = false }
wreq-proto = { package = "phantom-wreq-proto", version = "=0.2.5-phantom.4", path = "vendor/wreq-proto" }
zeroize = "=1.9.0"
zstd = "0.14.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.bench]
debug = 1
