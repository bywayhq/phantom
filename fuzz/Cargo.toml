[package]
name = "phantom-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
http = "1.4.0"
http-body = "1.0.1"
libfuzzer-sys = "=0.4.13"
phantom = { package = "phantom-http", version = "=0.1.0", path = "../crates/phantom", features = ["cookies"] }
phantom-net = { path = "../crates/phantom-net", features = ["https-records"] }
phantom-testkit = { path = "../crates/phantom-testkit" }
quinn-proto = { package = "phantom-quinn-proto", version = "=0.11.18-phantom.1", path = "../vendor/quinn-proto", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }

[[bin]]
name = "client_hello"
path = "fuzz_targets/client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_connect_response"
path = "fuzz_targets/http_connect_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http2_frame"
path = "fuzz_targets/http2_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic_transport_parameters"
path = "fuzz_targets/quic_transport_parameters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_basic_challenge"
path = "fuzz_targets/proxy_basic_challenge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http1_response"
path = "fuzz_targets/http1_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookie_jar"
path = "fuzz_targets/cookie_jar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookie_snapshot"
path = "fuzz_targets/cookie_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "alt_svc_snapshot"
path = "fuzz_targets/alt_svc_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "https_record"
path = "fuzz_targets/https_record.rs"
test = false
doc = false
bench = false
