[package]
name = "phantom-python"
description = "Native Python adapter for Phantom's asynchronous HTTP client"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
http = "1.4.0"
http-body = "1.1.0"
http-body-util = "0.1.3"
phantom = { package = "phantom-http", path = "../../crates/phantom", features = ["cookies"] }
phantom-profile = { path = "../../crates/phantom-profile" }
pyo3 = { version = "=0.29.3", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
