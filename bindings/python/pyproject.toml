[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "phantom-http"
version = "0.5.1"
description = "HTTP requests with explicit browser profiles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.12.2,<5"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

[project.urls]
Repository = "https://github.com/bywayhq/phantom"
Documentation = "https://github.com/bywayhq/phantom/blob/main/bindings/python/README.md"

[tool.maturin]
python-source = "python"
module-name = "phantom_http._native"
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
