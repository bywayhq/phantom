[package]
name = "phantom-node"
description = "Native Node.js adapter for Phantom"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes.workspace = true
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
http = "1.4.0"
http-body = "1.1.0"
http-body-util = "0.1.3"
napi = { version = "=3.14.2", features = ["napi8", "async"] }
napi-derive = "=3.6.12"
phantom = { package = "phantom-http", path = "../../crates/phantom", features = ["cookies", "fingerprint-import", "session-snapshot", "websocket"] }
phantom-profile = { path = "../../crates/phantom-profile" }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync", "time"] }
zeroize.workspace = true

[build-dependencies]
napi-build = "=2.6.0"

# Node-API registration macros generate unsafe FFI and constructor attributes.
# Only the private ffi module permits them; the rest of this crate stays denied.
[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
cast_lossless = "warn"
dbg_macro = "deny"
expect_used = "warn"
must_use_candidate = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
